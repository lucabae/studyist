<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Studyist. Local-first study workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2d3d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.35"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <rect x="72" y="96" width="112" height="4" fill="#34d399"/>

  <text x="72" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#6ee7b7" letter-spacing="4">LOCAL-FIRST STUDY WORKSPACE</text>

  <text x="72" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#f8fafc">Studyist</text>

  <text x="72" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#94a3b8">Courses, notes, flashcards, calendar and AI exercises. One local database.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#cbd5e1">
    <rect x="72" y="440" width="150" height="44" rx="8" fill="#0f2231" stroke="#22405a"/>
    <text x="92" y="468">FastAPI</text>
    <rect x="236" y="440" width="150" height="44" rx="8" fill="#0f2231" stroke="#22405a"/>
    <text x="256" y="468">SQLite</text>
    <rect x="400" y="440" width="190" height="44" rx="8" fill="#0f2231" stroke="#22405a"/>
    <text x="420" y="468">FTS5</text>
    <rect x="604" y="440" width="170" height="44" rx="8" fill="#0f2231" stroke="#22405a"/>
    <text x="624" y="468">CalDAV</text>
    <rect x="788" y="440" width="250" height="44" rx="8" fill="#0f2231" stroke="#22405a"/>
    <text x="808" y="468">JWT · PBKDF2</text>
  </g>

  <text x="72" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64748b">github.com/lucabae/studyist</text>
</svg>
